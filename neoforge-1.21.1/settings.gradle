pluginManagement {
    repositories {
        // Mirror first: on networks where maven.neoforged.net is blocked this is the
        // only reachable source for the NeoForge artefacts (see
        // readme_dev/PORT_neoforge_1.21.1.md §4.2).
        maven {
            name = 'NeoForged mirror (BMCLAPI)'
            url = 'https://bmclapi2.bangbang93.com/maven'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS: the repositories below apply to every configuration in the
    // build, including the ones ModDevGradle creates internally - which is what makes
    // the mirror actually take effect for the NeoForge / NeoForm artefacts.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven {
            name = 'NeoForged mirror (BMCLAPI)'
            url = 'https://bmclapi2.bangbang93.com/maven'
            content {
                includeGroup 'net.neoforged'
                includeGroup 'net.neoforged.fancymodloader'
                includeGroup 'net.minecraftforge'
            }
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'immersive-paintings-enhanced-neoforge-1.21.1'
