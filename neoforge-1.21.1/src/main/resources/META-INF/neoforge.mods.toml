modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"

[[mods]]
modId = "ipe"
version = "0.2.0+1.21.1"
displayName = "Immersive Paintings: Enhanced"
authors = "EnderDavid"
description = '''
Enhancements for Immersive Paintings: hang pictures at 45 degrees, and stop Create contraptions and trains from colliding with pictures.'''
logoFile = "icon.png"
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "ipe.mixins.json"

[[mixins]]
config = "ipe.create.mixins.json"

# Optional: refuses to turn a 45 degree graffiti into a block, because that mod's block
# renderer ignores the stored yaw for wall mounted graffiti. Guarded by ImbMixinPlugin, so
# it is inert unless "imb" (Immersive Painting Blocks) is installed.
[[mixins]]
config = "ipe.imb.mixins.json"

[[dependencies.ipe]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ipe]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ipe]]
modId = "immersive_paintings"
type = "required"
versionRange = "[0.8.0,)"
ordering = "NONE"
side = "BOTH"

# Create is strictly optional: com.ipe.create.mixin.CreateMixinPlugin only applies the
# contraption mixin when it is installed. NOTE: this must be "type", not the old Forge
# "mandatory = false" boolean - NeoForge 21.x ignores/deprecates "mandatory" and treats
# the dependency as required, which made mod loading abort with
#     Mod ipe requires create any
[[dependencies.ipe]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Immersive Painting Blocks is optional in the same way: without it the angled graffiti guard in
# com.ipe.imb.mixin is simply never applied. 1.0.1 is the release that stores yaw and shift data on
# the block entity, i.e. the version whose internals the guard was written against.
[[dependencies.ipe]]
modId = "imb"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"
