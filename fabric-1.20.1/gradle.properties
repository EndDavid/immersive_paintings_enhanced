# ---------------------------------------------------------------------------
# Gradle daemon
#
# Loom 1.15 requires a Java 21 JVM, while Minecraft 1.20.1 targets Java 17.
# The daemon therefore runs on the bundled JDK 21 and JavaCompile is pinned to
# `release = 17` in build.gradle. Adjust both paths if the bundled JDK moves.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.home=D:/codename_EndDavid/hello java/jdk-21.0.2
org.gradle.java.installations.paths=D:/codename_EndDavid/hello java/jdk-21.0.2

# Fail fast on an unreachable repository instead of stalling for minutes.
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=20000

# ---------------------------------------------------------------------------
# Optional HTTP proxy - DISABLED BY DEFAULT
#
# Only needed when a local proxy is running AND something has to be downloaded.
# The JVM does not read the Windows system proxy. Uncomment the five lines,
# then `.\gradlew.bat --stop` once (the daemon caches system properties).
# Keep them commented out when the proxy is off, otherwise every request fails
# with "Connection refused: connect".
# ---------------------------------------------------------------------------
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# ---------------------------------------------------------------------------
# Fabric / Minecraft
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
# 0.15.7 rather than upstream's 0.14.21: the Fabric API build we use for the
# dev runs (0.92.2+1.20.1) declares `fabricloader >=0.15.6`. A production
# instance can of course still run any loader that satisfies fabric.mod.json.
loader_version=0.15.7
loom_version=1.15.5

# Fabric API is only needed because Immersive Paintings' 1.20.1 jar declares
# `fabric-api-base`; our code does not import Fabric API.
fabric_api_version=0.92.2+1.20.1

# ---------------------------------------------------------------------------
# Mod properties
#
# The mod id ("ipe") and display name ("Immersive Paintings: Enhanced") are
# unchanged from the 1.18.2 build; only the artifact name and the version
# suffix distinguish the two jars.
# ---------------------------------------------------------------------------
mod_version=0.2.0+1.20.1
maven_group=com.ipe
archives_base_name=immersive_paintings_enhanced_fabric

# ---------------------------------------------------------------------------
# Dependencies
#
# IMPORTANT: this is the Modrinth *version ID*, not the version number.
# 0.6.13+1.20.1 exists twice on Modrinth (fabric and forge); resolving by
# version number lets the Maven endpoint pick whichever file it finds first,
# which is how the NeoForge port once ended up compiling against a Fabric jar.
#   TOHB3jQz -> immersive_paintings-0.6.13+1.20.1-fabric.jar
# ---------------------------------------------------------------------------
immersive_paintings_version=TOHB3jQz
