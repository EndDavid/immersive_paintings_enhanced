# ---------------------------------------------------------------------------
# Gradle daemon
#
# NeoForge 1.21.1 needs Java 21, both to run Gradle and to compile the mod, so
# the daemon JVM is pinned here instead of relying on JAVA_HOME / PATH.
# Adjust the path if the bundled JDK ever moves.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.home=D:/codename_EndDavid/hello java/jdk-21.0.2
org.gradle.java.installations.paths=D:/codename_EndDavid/hello java/jdk-21.0.2

# ---------------------------------------------------------------------------
# Network
#
# Default Gradle timeouts are 30 s connect / 30 s read with several retries per
# artifact. If a repository is unreachable (see readme_dev/PORT_neoforge_1.21.1.md
# section 4.2) that turns into a multi-minute stall before anything useful is printed.
# Failing after 10 s makes the actual problem visible immediately; raise these if
# you are on a slow but working connection.
# ---------------------------------------------------------------------------
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=20000

# ---------------------------------------------------------------------------
# Mod properties
# ---------------------------------------------------------------------------
mod_id=ipe
mod_name=Immersive Paintings: Enhanced
mod_author=EnderDavid
license=GPL-3.0-only

# The "+1.21.1" suffix keeps the two loader builds distinguishable.
mod_version=0.2.0+1.21.1
maven_group=com.ipe
archives_base_name=immersive_paintings_enhanced_neoforge

# ---------------------------------------------------------------------------
# NeoForge / Minecraft
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
neoforge_version=21.1.154

# ---------------------------------------------------------------------------
# Dependencies
#
# Immersive Paintings 0.8.0+1.21.1 is the first release whose entity model
# matches the 1.21.1 branch of the upstream repository (HangingEntity based).
#
# IMPORTANT: these are Modrinth *version IDs*, not version numbers.
# The project publishes both loaders under the same version number
# ("0.8.0+1.21.1" exists twice, once for fabric and once for neoforge), and the
# Maven endpoint resolves a version number to whichever file it finds first.
# That silently put the FABRIC jar on the classpath, which then failed to
# compile with "cannot find symbol: class class_1530" - intermediary names.
# Using the ID pins the exact file:
#   pWBBXq0j -> immersive_paintings-neoforge-1.21.1-0.8.0.jar
#   Wv4us2nU -> immersive_paintings-fabric-1.21.1-0.8.0.jar   (do NOT use)
# ---------------------------------------------------------------------------
immersive_paintings_version=pWBBXq0j

# fzzy_config is a hard runtime dependency of Immersive Paintings, so the dev
# runs need it as well. Also pinned by ID for the same reason:
#   uG7oHgw6 -> fzzy_config-0.7.7+1.21+neoforge.jar
fzzy_config_version=uG7oHgw6

# fzzy_config is written in Kotlin and refuses to load without KotlinForForge:
#   "Mod fzzy_config requires kotlinforforge 5.3.0 or above"
# 5.9.0 declares minecraft versionRange [1.20.6,1.22) and loaderVersion [5,),
# which covers 1.21.1 / NeoForge 21.1.x. runtimeOnly - nothing compiles against it.
#   4qCjWixP -> kotlinforforge-5.9.0-all.jar
kotlinforforge_version=4qCjWixP
